# nginx dentro del contenedor "app" de Railway.
#
# Sirve la SPA de Taiga y hace de reverse proxy hacia los procesos internos
# del mismo contenedor: gunicorn (API) en 127.0.0.1:8000 y taiga-events
# (WebSockets) en 127.0.0.1:8888.
#
# Railway termina el TLS en su borde y reenvía HTTP, por lo que
# X-Forwarded-Proto / X-Scheme se fuerzan a https para que Django genere
# URLs absolutas y cookies Secure correctamente (ver
# SECURE_PROXY_SSL_HEADER en settings/common.py de taiga-back).

server {
    listen 80;
    server_name _;

    client_max_body_size 100M;
    charset utf-8;

    # --- SPA (front) ------------------------------------------------------
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html =404;
    }

    # --- API ---------------------------------------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_pass_header Server;
        proxy_set_header Host $http_host;
        proxy_redirect off;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Scheme https;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # --- Admin de Django ---------------------------------------------------
    location /admin/ {
        proxy_pass http://127.0.0.1:8000/admin/;
        proxy_pass_header Server;
        proxy_set_header Host $http_host;
        proxy_redirect off;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Scheme https;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # --- Estáticos de Django (servidos por el backend sobre HTTP) ----------
    location /static/ {
        proxy_pass http://127.0.0.1:8000/static/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Scheme https;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # --- Media (adjuntos y avatares, servidos por el backend) --------------
    location /media/ {
        proxy_pass http://127.0.0.1:8000/media/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Scheme https;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # --- Eventos (WebSocket) ------------------------------------------------
    location /events {
        proxy_pass http://127.0.0.1:8888/events;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Scheme $scheme;
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;
    }
}
