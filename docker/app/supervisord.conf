; Supervisord para el contenedor "app" de Taiga en Railway.
;
; Orquesta los 4 procesos del stack en un único contenedor:
;   nginx (80, público), gunicorn (8000), celery -B (tareas) y
;   taiga-events (8888, WebSockets).
;
; GUNICORN_WORKERS y CELERY_CONCURRENCY se exportan en el entrypoint con
; valores por defecto ajustados a la capa gratuita (1/1): todo el stack
; comparte 512 MB de RAM en el plan Free.

[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
user=root
priority=10
autostart=true
autorestart=true
startsecs=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:taiga-back]
command=gunicorn taiga.wsgi:application --name taiga_api --bind 0.0.0.0:8000 --worker-tmp-dir /dev/shm --log-level=info --access-logfile - --workers %(ENV_GUNICORN_WORKERS)s
directory=/taiga-back
user=taiga
priority=20
autostart=true
autorestart=true
startsecs=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:taiga-async]
command=celery -A taiga.celery worker -B --concurrency %(ENV_CELERY_CONCURRENCY)s -l INFO
directory=/taiga-back
user=taiga
priority=30
autostart=true
autorestart=true
startsecs=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:taiga-events]
command=node ./src/index.js
directory=/taiga-events
user=taiga
environment=NODE_ENV="production"
priority=40
autostart=true
autorestart=true
startsecs=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
