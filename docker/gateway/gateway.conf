# Configuración de nginx para el gateway público de Taiga en Railway.
#
# Sirve la SPA y hace de reverse proxy hacia los servicios PRIVADOS del
# proyecto de Railway mediante los dominios *.railway.internal.
# Importante: no renombrar los servicios taiga-back y taiga-events en
# Railway o habrá que actualizar los hostnames de abajo.

server {
    listen 80 default_server;

    client_max_body_size 100M;
    charset utf-8;

    # --- SPA (front) ----------------------------------------------------
    location / {
        alias /usr/share/nginx/html/;
        index index.html;
        try_files $uri $uri/ index.html =404;
    }

    # --- API ------------------------------------------------------------
    location /api/ {
        proxy_pass http://taiga-back.railway.internal:8000/api/;
        proxy_pass_header Server;
        proxy_set_header Host $http_host;
        proxy_redirect off;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Scheme https;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # --- Admin de Django ------------------------------------------------
    location /admin/ {
        proxy_pass http://taiga-back.railway.internal:8000/admin/;
        proxy_pass_header Server;
        proxy_set_header Host $http_host;
        proxy_redirect off;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Scheme https;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # --- Estáticos de Django (servidos por el backend) -------------------
    location /static/ {
        proxy_pass http://taiga-back.railway.internal:8000/static/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Scheme https;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # --- Media (adjuntos y avatares, servidos por el backend) ------------
    location /media/ {
        proxy_pass http://taiga-back.railway.internal:8000/media/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Scheme https;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # --- Eventos (WebSocket) ---------------------------------------------
    location /events {
        proxy_pass http://taiga-events.railway.internal:8888/events;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Scheme $scheme;
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;
    }
}
